<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kitchen Kompanion - Shopping List</title>

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/shopping.css">
</head>
<body>

  <div class="app">

    <header class="shop-header">
      <h1>Shopping List</h1>
      <p id="summary">5 items to buy</p>
    </header>

    <main class="shop-main">

      <section class="shop-group">
        <h2>For Veggie Omelet</h2>
        <ul class="shop-list">
          <li class="shop-item">
            <input type="checkbox" id="item1">
            <label for="item1">
              <span class="item-name">Eggs</span>
              <span class="item-note">you have 2 of 4</span>
            </label>
            <span class="item-qty short">2 needed</span>
          </li>
          <li class="shop-item">
            <input type="checkbox" id="item2">
            <label for="item2">
              <span class="item-name">Baby spinach</span>
            </label>
            <span class="item-qty">1 bag</span>
          </li>
        </ul>
      </section>

      <section class="shop-group">
        <h2>For Chicken Fried Rice</h2>
        <ul class="shop-list">
          <li class="shop-item">
            <input type="checkbox" id="item3">
            <label for="item3">
              <span class="item-name">Soy sauce</span>
            </label>
            <span class="item-qty">1 bottle</span>
          </li>
          <li class="shop-item">
            <input type="checkbox" id="item4">
            <label for="item4">
              <span class="item-name">Frozen peas</span>
            </label>
            <span class="item-qty">1 lb</span>
          </li>
        </ul>
      </section>

      <section class="shop-group">
        <h2>Added by me</h2>
        <ul class="shop-list">
          <li class="shop-item">
            <input type="checkbox" id="item5">
            <label for="item5">
              <span class="item-name">Olive oil</span>
              <span class="item-note">extra virgin</span>
            </label>
            <span class="item-qty">1 bottle</span>
          </li>
        </ul>
      </section>

    </main>

    <div class="shop-footer">
      <button class="primary-button" onclick="alert('Under development')">
        + Add item
      </button>
    </div>

    <nav class="bottom-nav">
      <a href="index.html">Inventory</a>
      <a href="recipes.html">Recipes</a>
      <a href="mealplan.html">Meal Plan</a>
      <a href="shopping.html" class="active" aria-current="page">Shopping</a>
    </nav>

  </div>

  <script src="shopping.js"></script>
</body>
</html>
