<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Kompanion | Shopping List</title>

    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/shopping.css">
</head>
<body>
    <div class="app">
        <header class="shop-header">
            <h1>Shopping List</h1>
            <p id="summary" aria-live="polite"></p>
        </header>

        <main class="shop-main">
            <div id="message" class="message" hidden></div>
            <div id="list-area"></div>
        </main>

        <div class="shop-footer">
            <button class="secondary-button" type="button" onclick="goToAddItem()">+ Add item</button>
            <button class="primary-button" id="move-button" type="button" onclick="goToBought()">Move to inventory (0)</button>
        </div>

        <nav class="bottom-nav" aria-label="Main navigation">
            <a href="index.html">Inventory</a>
            <a href="recipes.html">Recipes</a>
            <a href="meal_planner.html">Planner</a>
            <a href="shopping.html" class="active" aria-current="page">Shopping</a>
        </nav>
    </div>

    <script src="./data.js"></script>
    <script src="./shopping.js"></script>
</body>
</html>
