<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kitchen Kompanion - Shopping List</title>

  <!-- Shared by every screen -->
  <link rel="stylesheet" href="global.css">
  <!-- Only this screen -->
  <link rel="stylesheet" href="shopping.css">
</head>
<body>

  <div class="app">

    <header class="shop-header">
      <h1>Shopping List</h1>
      <p class="shop-summary">5 items to buy</p>
    </header>

    <main class="shop-main">

      <section class="shop-group">
        <h2>For Veggie Omelet</h2>
        <ul class="shop-list">
          <li class="shop-item">
            <input type="checkbox" id="item1">
            <label for="item1">
              <span class="item-name">Eggs</span>
              <span class="item-note short">2 needed (you have 2 of 4)</span>
            </label>
          </li>
          <li class="shop-item">
            <input type="checkbox" id="item2">
            <label for="item2">
              <span class="item-name">Baby spinach</span>
              <span class="item-note">1 bag</span>
            </label>
          </li>
        </ul>
      </section>

      <section class="shop-group">
        <h2>For Chicken Fried Rice</h2>
        <ul class="shop-list">
          <li class="shop-item">
            <input type="checkbox" id="item3">
            <label for="item3">
              <span class="item-name">Soy sauce</span>
              <span class="item-note">1 bottle</span>
            </label>
          </li>
          <li class="shop-item">
            <input type="checkbox" id="item4">
            <label for="item4">
              <span class="item-name">Frozen peas</span>
              <span class="item-note">1 lb</span>
            </label>
          </li>
        </ul>
      </section>

      <section class="shop-group">
        <h2>Added by me</h2>
        <ul class="shop-list">
          <li class="shop-item">
            <input type="checkbox" id="item5">
            <label for="item5">
              <span class="item-name">Olive oil</span>
              <span class="item-note">1 bottle, extra virgin</span>
            </label>
          </li>
        </ul>
      </section>

      <!-- "Add item" task is not built yet -->
      <button class="primary-button" onclick="alert('Under development')">
        + Add item
      </button>

    </main>

    <!-- Bottom navigation: copy this exact block onto every page.
         Only change which link has class="active". -->
    <nav class="bottom-nav">
      <a href="index.html">Inventory</a>
      <a href="recipes.html">Recipes</a>
      <a href="mealplan.html">Meal Plan</a>
      <a href="shopping.html" class="active" aria-current="page">Shopping</a>
    </nav>

  </div>

</body>
</html>
