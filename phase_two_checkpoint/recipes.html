<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Kompanion | Recipes</title>

    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/recipes.css">
</head>

<body>
    <div class="recipes-screen">
        <main>
            <header class="recipes-header">
                <p class="eyebrow">KITCHEN KOMPANION</p>
                <h1>Recipes</h1>
            </header>

            <section class="recipe-controls" aria-label="Recipe filters">
                <div class="recipe-tabs" role="group" aria-label="Ingredient availability">
                    <button class="recipe-tab active" type="button" data-availability="ready" aria-pressed="true">
                        Ready to Cook
                    </button>
                    <button class="recipe-tab" type="button" data-availability="shopping" aria-pressed="false">
                        Requires Shopping
                    </button>
                </div>

                <fieldset class="diner-picker">
                    <legend>Who's eating?</legend>
                    <label class="diner-option">
                        <input type="checkbox" name="diner" value="bob" checked>
                        <span><strong>Bob</strong><small>Vegan · Peanut allergy</small></span>
                    </label>
                    <label class="diner-option">
                        <input type="checkbox" name="diner" value="alex">
                        <span><strong>Alex</strong><small>No dietary restrictions</small></span>
                    </label>
                    <p class="diner-hint">Recipes that don't fit everyone's needs are hidden.</p>
                </fieldset>

                <div class="recipe-filters" aria-label="Additional filters">
                    <button class="recipe-filter" type="button" data-filter="expiring" aria-pressed="false">
                        Use expiring food
                    </button>
                    <button class="recipe-filter" type="button" data-filter="quick" aria-pressed="false">
                        Under 30 min
                    </button>
                    <button class="recipe-filter" type="button" data-filter="beginner" aria-pressed="false">
                        Beginner
                    </button>
                    <button class="recipe-filter" type="button" data-filter="favorites" aria-pressed="false">
                        Favorites
                    </button>
                </div>
            </section>

            <section class="recipe-section" aria-labelledby="recipe-heading">
                <div class="recipe-section-heading">
                    <h2 id="recipe-heading">Ready to cook</h2>
                    <span id="recipe-count" aria-live="polite"></span>
                </div>
                <p id="recipe-empty" class="recipe-empty" hidden>No recipes match these filters.</p>
                <ul class="recipe-list" id="recipe-list" aria-live="polite"></ul>
            </section>
        </main>

        <nav class="bottom-nav" aria-label="Main navigation">
            <a href="index.html">Inventory</a>
            <a href="recipes.html" class="active" aria-current="page">Recipes</a>
            <a href="meal_planner.html">Planner</a>
            <a href="shopping.html">Shopping</a>
        </nav>
    </div>

    <script src="./data.js"></script>
    <script src="./js/recipes.js"></script>
</body>
</html>
