<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner | Kitchen Kompanion</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/meal_planner.css">
</head>
<body>
    <div class="app planner-screen">
        <main>

            <div class="planner-header">
                <p class="eyebrow">KITCHEN KOMPANION</p>
                <h1>Meal Planner</h1>
            </div>


            <div class="week-selector">
                <button class="week-arrow" type="button">&lt;</button>
                <div class="week-text">
                    <p class="week-label">CURRENT WEEK</p>
                    <h2>Oct 5 - Oct 11</h2>
                </div>
                <button class="week-arrow" type="button">&gt;</button>
            </div>


            <div class="meal-section">
                <div class="section-heading">
                    <h2>This week</h2>
                    <span>7 days</span>
                </div>

                <div class="meal-list" id="mealList">
                    <!-- rows get added here by meal_planner.js -->
                </div>

                <button type="button" id="generateBtn" class="primary-button" onclick="generateShoppingList()">
                    Generate Shopping List
                </button>
            </div>

        </main>


        <nav class="bottom-nav">
            <a href="index.html">Inventory</a>
            <a href="recipes.html">Recipes</a>
            <a href="meal_planner.html" class="active">Planner</a>
        </nav>

    </div>


    <script src="data.js"></script>
    <script src="meal_planner.js"></script>
</body>
</html>
