
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Kompanion - Inventory</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
  </head>

<body>
  <div class="app inventory-screen">

    <main class="inventory-main">
      <header class="inventory-header">
        <p class="eyebrow">KITCHEN KOMPANION</p>
        <h1>Inventory</h1>
      </header>

      <div class="search-bar">
        <input
          type="text"
          id="inventory-search"
          placeholder="Search your inventory"
          aria-label="Search your inventory"
        >

        <button
          class="add-button"
          type="button"
          onclick="window.location.href='AddItem.html'"
          aria-label="Add inventory item"
        >+</button>
      </div>

      <section class="inventory-controls" aria-label="Recipe filters">

        <div class="inventory-filters" aria-label="Additional filters">
          <button class="inventory-filter" type="button" data-filter="expiring" aria-pressed="false">
            Expiring soon
          </button>
          <button class="inventory-filter" type="button" data-filter="low" aria-pressed="false">
            No stock
          </button>
        </div>

      </section>

      <!-- Fridge Section Bucket -->
      <section class="inventory-section" id="fridge-section">
        <div class="inventory-section-heading" onclick="toggleBucket('fridge-section')">
          <div style="display: flex; align-items: center; gap: 8px;">
            <h2 class="toggle-arrow">Fridge ▾</h2>
          </div>
          <span id="fridge-count">0 items</span>
        </div>

        <ul class="inventory-list" id="fridge-list">
          <!-- Populated dynamically by inventory.js -->
        </ul>
      </section>

      <!-- Pantry Section Bucket -->
      <section class="inventory-section" id="pantry-section">
        <div class="inventory-section-heading" onclick="toggleBucket('pantry-section')">
          <div style="display: flex; align-items: center; gap: 8px;">
            <h2 class="toggle-arrow">Pantry ▾</h2>
          </div>
          <span id="pantry-count">0 items</span>
        </div>

        <ul class="inventory-list" id="pantry-list"></ul>
      </section>

      <!-- Freezer Section Bucket -->
      <section class="inventory-section" id="freezer-section">
        <div class="inventory-section-heading" onclick="toggleBucket('freezer-section')">
          <div style="display: flex; align-items: center; gap: 8px;">
            <h2 class="toggle-arrow">Freezer ▾</h2>
          </div>
          <span id="freezer-count">0 items</span>
        </div>

        <ul class="inventory-list" id="freezer-list"></ul>
      </section>

    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <a href="index.html" class="active" aria-current="page">Inventory</a>
      <a href="recipes.html">Recipes</a>
      <a href="meal_planner.html">Planner</a>
      <a href="shopping.html">Shopping</a>
    </nav>
  </div>

  <script src="./js/data.js"></script>
  <script src="./js/inventory.js"></script>
</body>
</html>
