<!DOCTYPE html>
<html lang = "en">

<head>
    <meta charset = "UTF-8">
    <title>Phase 1.2</title>
    <link rel= "stylesheet" href = "css/main.css">
    <link rel= "stylesheet" href = "css/tab1.css">
    <link rel= "stylesheet" href = "css/tab2.css">
    <link rel= "stylesheet" href = "css/tab3.css">
    <link rel= "stylesheet" href = "css/tab4.css">
    <link rel= "stylesheet" href = "css/tab5.css">
    <link rel= "stylesheet" href = "css/tab6.css">
    <script src="js/chart.js"></script>
    <script src="js/chart-labels.js"></script>
</head>

<body>
    <div id = "phone">
        <div id = "content">

            <section id = "tab1" class = "tab-page active">
                <h2>Text</h2>
            </section>

            <section id = "tab2" class = "tab-page">
                <p>Down Here</p>
            </section>

            <section
                id = "tab3" 
                class = "tab-page"
            >
                <h2>Colors</h2>
                <p class="colorful-1">CMSC434 grade distribution</p>
                <p class="colorful-2">from PlanetTerp</p>
                <canvas
                    id="colorful-chart" 
                    style="width:100%; max-width:600px"></canvas>
            </section>

            <section id = "tab4" class = "tab-page">
                <h2>-User Profile-</h2>
                <button id = "profile-image-button" type = "button" aria-label = "Show profile image warning">
                    <img id = "profile-image" src = "images/SmileyFace.png" alt = "Smiley face">
                </button>
                <p class = "profile-name">Smiley J. Smile</p>
                <div id = "profile-notice" class = "profile-notice" role = "alert" hidden>
                    <p><strong>Warning!</strong> Do not click on the profile image.</p>
                    <button id = "close-profile-notice" type = "button" aria-label = "Close notification">&times;</button>
                </div>
            </section>

            <section id = "tab5" class = "tab-page">
                <h2>Choices</h2>

                <p><strong>Pick a size:</strong></p>
                <label><input type = "radio" name = "size" value = "Small"> Small</label><br>
                <label><input type = "radio" name = "size" value = "Medium"> Medium</label><br>
                <label><input type = "radio" name = "size" value = "Large"> Small</label><br>

                <p><strong>Pick a flavor:</strong></p>
                <select id = "flavor">
                    <option value = "Vanilla">Vanilla</option>
                    <option value = "Chocolate">Chocolate</option>
                    <option value = "Strawberry">Strawberry</option>
                </select>

                <p><button id = "orderBtn">Show my choices</button></p>
                <p id = "choiceResult"></p>
            </section>

            <section id = "tab6" class = "tab-page">
                <h2>ToDo</h2>
            </section>

         </div>

        <nav id = "nav">
            <button class = "nav-btn active" data-tab = "tab1"><img class = "icon" src = "icons/Text.png" alt = "">Text</button>
            <button class = "nav-btn" data-tab = "tab2"><img class = "icon" src = "icons/LR.png" alt = "">LR</button>
            <button class = "nav-btn" data-tab = "tab3"><img class = "icon" src = "icons/Colors.png" alt = "">Colors</button>
            <button class = "nav-btn" data-tab = "tab4"><img class = "icon" src = "icons/Profile.png" alt = "">Profile</button>
            <button class = "nav-btn" data-tab = "tab5"><img class = "icon" src = "icons/Choices.png" alt = "">Choices</button>
            <button class = "nav-btn" data-tab = "tab6"><img class = "icon" src = "icons/ToDo.png" alt = "">ToDo</button>
        </nav>
    </div>

    <script src="js/main.js"></script>
    <script src="js/tab1.js"></script>
    <script src="js/tab2.js"></script>
    <script src="js/tab3.js"></script>
    <script src="js/tab4.js"></script>
    <script src="js/tab5.js"></script>
    <script src="js/tab6.js"></script>
</body>
</html>
